<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Coach">
<title>Home Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--chalk:#090C0A;--paper:#131915;--ink:#EFF4EF;--mute:#8E9F95;--line:#27322B;--cobalt:#3DDC84;--stage:#0C2617;--flare:#3DDC84;--mint:#1C9A5B;--sky:#9CCDB1;--on:#04140B;--warn:#FF7A6B;
  --disp:"Bricolage Grotesque",system-ui,sans-serif;--body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--chalk)}
body{margin:0;color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body.live{background:var(--stage)}
#app{max-width:480px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px 104px}
h1{font:800 40px/1 var(--disp);margin:0;letter-spacing:-.005em}
h2{font:700 24px/1.1 var(--disp);margin:30px 0 12px}
h3{font:700 17px/1.2 var(--body);margin:22px 0 8px}
p{margin:0}
.sub{color:var(--mute);font-size:15px}
button{font:600 16px var(--body);color:inherit;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--chalk)}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--flare);outline-offset:2px}
.pri{background:var(--flare);color:var(--on);width:100%;font:700 22px var(--disp);letter-spacing:.01em;padding:16px;border-radius:16px}
.sec{background:var(--paper);border:1.5px solid var(--line);width:100%}
.txt{background:none;color:var(--cobalt);padding:10px 4px}
input{font:inherit;color:var(--ink);background:var(--chalk);border:1.5px solid var(--line);border-radius:14px;padding:13px;width:100%}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1;min-width:0}.row>button{flex:none}
.card{border:1px solid var(--line);background:var(--paper);border-radius:22px;padding:18px;margin-bottom:12px}
.pad0{padding:0;overflow:hidden}.in{padding:16px 18px 18px}

/* photo demo */
.demo{position:relative;aspect-ratio:3/2;overflow:hidden;background:#0c1a2b}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo.go .f2{animation:flip 2.6s infinite}
.demo.b .f2{opacity:1;animation:none}.demo.a .f2{opacity:0;animation:none}
@keyframes flip{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.demo.go .f2{animation:none;opacity:0}}

/* today */
.kind{font:700 30px/1 var(--disp);margin-bottom:4px}
.okline{color:var(--cobalt);font-weight:700;margin:12px 0}
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 4px;padding:0 16px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;width:132px;background:var(--paper);border-radius:16px;overflow:hidden;text-align:left;padding:0;font-weight:600}
.chip .demo{aspect-ratio:4/3}
.chip span{display:block;padding:8px 10px 0;font-size:14px;line-height:1.2}
.chip small{display:block;padding:1px 10px 10px;color:var(--mute);font-weight:500}
.habit{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1.5px solid var(--chalk);cursor:pointer;background:none;width:100%;border-radius:0;text-align:left;font-weight:500}
.habit:last-child{border:0;padding-bottom:0}.habit:first-child{padding-top:0}
.box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:800;color:#fff}
.habit.on .box{background:var(--mint);border-color:var(--mint)}
.watch{font:800 64px/1 var(--disp);font-variant-numeric:tabular-nums;margin:10px 0 12px}

/* library */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .chip{width:auto}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(12,26,43,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .in{padding:18px 20px 28px}
.sheet h2{font-size:34px;margin:0 0 2px}
.sheet ol,.sheet ul{margin:0;padding-left:22px}.sheet li{margin-bottom:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.two div{background:var(--chalk);border-radius:16px;padding:12px 14px;font-size:14px}
.two b{display:block;margin-bottom:3px}
a.yt{display:block;text-align:center;text-decoration:none;font-weight:600;color:var(--cobalt);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:20px 0 8px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border-radius:18px;padding:14px 8px;text-align:center}
.stat b{display:block;font:800 34px/1 var(--disp)}.stat span{font-size:13px;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:10px;background:var(--chalk);font-size:12px;display:grid;place-items:center;color:var(--mute)}
.cal .hd{background:none;aspect-ratio:auto;padding-bottom:2px}
.cal .c{background:var(--cobalt);color:var(--on);font-weight:700}
.cal .w{background:#1D5437;color:#fff;font-weight:700}
.cal .miss{background:none;box-shadow:inset 0 0 0 1.5px var(--warn);color:var(--warn)}
.cal .now{box-shadow:inset 0 0 0 2.5px var(--ink)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:12px}
.dot{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{background:var(--paper);border-radius:16px;padding:12px 14px;font-weight:600;font-size:14px;line-height:1.25;color:var(--mute);display:flex;gap:10px;align-items:center}
.badge i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--chalk);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--line)}
.badge.on{color:var(--ink)}.badge.on i{background:var(--flare);color:var(--on)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px solid var(--chalk)}
ul.list li:last-child{border:0;padding-bottom:0}ul.list li:first-child{padding-top:0}
ul.list small{display:block;color:var(--mute);font-size:14px}ul.list b{white-space:nowrap}
svg.ch{width:100%;height:auto;display:block}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(9,12,10,.94);backdrop-filter:blur(12px);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border-radius:0;color:var(--mute);padding:10px 0 12px;font-size:13px}
nav svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--cobalt)}

/* live session */
.live #app{padding:env(safe-area-inset-top) 0 24px;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px;gap:8px}
.top button{background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:9px 14px;font-size:14px}
.top span{font-weight:600}
.segs{display:flex;gap:4px;padding:0 16px 12px}
.segs i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.22)}.segs i.d{background:#fff}.segs i.c{background:var(--flare)}
.live .demo{margin:0 16px;border-radius:22px}
.how{position:absolute;right:10px;bottom:10px;background:rgba(12,26,43,.72);color:#fff;border-radius:99px;padding:8px 14px;font-size:14px;backdrop-filter:blur(6px)}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:14px 20px 8px}
.name{font:800 44px/1 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.num{font:800 112px/1 var(--disp);font-variant-numeric:tabular-nums;margin:2px 0 0}
.unit{font:600 20px var(--disp);color:var(--sky);margin-top:-4px}
.tip{color:#DCE5FF;max-width:340px;margin:10px auto 0}
.foot{padding:0 16px}
.nx{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--sky);font-size:15px;margin-bottom:12px}
.nx img{width:42px;height:32px;object-fit:cover;border-radius:8px}
.foot .row{margin-top:8px}.foot .row button{flex:1;background:rgba(255,255,255,.14);color:#fff}
.fin{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 20px;text-align:center}
.fin .name{font-size:64px}
.fin .stats{margin:22px 0}.fin .stat{background:rgba(255,255,255,.12)}.fin .stat span{color:var(--sky)}
.fin label{display:block;text-align:left;font-weight:600;margin-bottom:8px}

/* v3 look */
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
h1{font-size:30px;letter-spacing:-.02em}
h2{font-size:21px;letter-spacing:-.01em}
.pri{font-size:18px;letter-spacing:0;display:flex;align-items:center;justify-content:center;gap:8px}
.kind{font-size:26px;letter-spacing:-.01em}.watch{font-size:56px}.stat b{font-size:28px}
.name{font-size:34px;letter-spacing:0}.num{font-size:88px;letter-spacing:-.03em}.num.sm{font-size:64px}.unit{font-size:17px;margin-top:0}
.fin .name{font-size:46px}.sheet h2{font-size:28px}
.hero{border-bottom:1px solid #1B4A2F;margin:calc(-22px - env(safe-area-inset-top)) -16px 0;padding:calc(22px + env(safe-area-inset-top)) 16px 60px;background:var(--stage);color:#fff;border-radius:0 0 30px 30px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{color:var(--sky);font-size:14px;font-weight:500;margin-bottom:3px}
.flame{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border-radius:99px;padding:8px 14px 8px 10px;font-weight:700}
.flame .ic{color:var(--flare);fill:var(--flare)}
.wkring{display:flex;align-items:center;gap:14px;margin:18px 0 16px}
.wkring b{display:block;font:700 19px var(--disp)}.wkring span{display:block;color:var(--sky);font-size:14px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk div{display:grid;justify-items:center;gap:5px;padding:8px 0 9px;border-radius:14px;background:rgba(255,255,255,.12);font-size:12px;font-weight:600;color:var(--sky)}
.wk .ic{color:#fff}
.wk .ok{background:var(--flare);color:var(--on)}.wk .ok .ic{color:var(--on)}
.wk .miss{box-shadow:inset 0 0 0 1.5px rgba(255,150,110,.9)}.wk .miss .ic{color:#FFB79C}
.wk .now{box-shadow:inset 0 0 0 2px #fff;color:#fff}
.lift{margin-top:-44px;position:relative;box-shadow:0 16px 32px -20px rgba(12,26,43,.5)}
.shot{position:relative}
.shot::after{content:"";position:absolute;inset:38% 0 0;background:linear-gradient(transparent,rgba(12,26,43,.85))}
.cap{position:absolute;left:18px;right:18px;bottom:14px;z-index:1;color:#fff}
.cap .kind{margin:7px 0 0}
.tagp{display:inline-block;background:var(--flare);color:var(--on);font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pills span{display:inline-flex;align-items:center;gap:6px;background:var(--chalk);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600}
.pills .ic{color:var(--cobalt)}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.h2row span{color:var(--mute);font-size:14px;font-weight:600}
.habs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hab{background:var(--paper);border-radius:18px;padding:14px 8px 12px;display:grid;justify-items:center;gap:8px;font-size:13px;font-weight:600;line-height:1.25;text-align:center}
.hab i{width:44px;height:44px;border-radius:50%;background:var(--chalk);display:grid;place-items:center;color:var(--cobalt)}
.hab.on{background:var(--mint);color:#fff;box-shadow:inset 0 0 0 1.5px var(--cobalt)}.hab.on i{background:rgba(255,255,255,.22);color:#fff}
.rowc{display:flex;gap:12px;align-items:center}
.rowc i{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(61,220,132,.14);color:var(--cobalt)}
.rowc.warm i{background:rgba(61,220,132,.14);color:var(--cobalt)}
.rowc b{display:block}.rowc span{display:block;color:var(--mute);font-size:14px}
.rowc .tagp{display:inline-block;color:var(--on);font-size:12px;margin-left:6px;vertical-align:2px}
.stat .ic{color:var(--cobalt);display:block;margin:0 auto 6px}
.top button{display:flex;align-items:center;gap:6px}
.okline{display:flex;align-items:center;gap:6px}

/* account */
button:disabled{opacity:.6}
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 16px}
.brand{text-align:center;margin-bottom:22px}
.brand i{width:64px;height:64px;border-radius:20px;background:var(--flare);color:var(--on);display:grid;place-items:center;margin:0 auto 14px}
.brand b{display:block;font:800 34px/1.1 var(--disp);letter-spacing:-.02em}.brand span{color:var(--sky)}
.authc{color:var(--ink)}.authc h2{margin:0 0 4px}
.authc label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.authc .pri{margin-top:18px}.authc .txt{width:100%;margin-top:4px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.amsg{margin-top:14px;font-size:14px;font-weight:600;color:var(--cobalt)}.amsg.bad{color:var(--warn)}
.sec2{background:rgba(255,255,255,.14);color:#fff;width:100%}
.txt.w{color:#fff;width:100%;margin-top:4px}
</style>
</head>

</div></nav>

const KEY='home-coach-v1';
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
let S=load();
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!s.days||!s.start)s={start:dkey(today()),days:{},weights:[]};
  s.weights=s.weights||[];if(s.voice===undefined)s.voice=true;return s;
}
function save(){S.at=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(auth.user)queuePush()}
const fresh=()=>({start:dkey(today()),days:{},weights:[],voice:true});

/* ---------- account and sync ---------- */
let sb=null,pushT=null;
const auth={on:false,ready:false,user:null,mode:'in',msg:'',err:false,busy:false,email:'',pw:'',sync:''};
try{if(CFG.url&&CFG.key&&window.supabase){sb=window.supabase.createClient(CFG.url,CFG.key);auth.on=true}}catch(e){}
function queuePush(){clearTimeout(pushT);pushT=setTimeout(push,1200)}
function showSync(){const el=document.querySelector('#sync');if(el)el.textContent=auth.sync}
async function push(){
  clearTimeout(pushT);if(!sb||!auth.user)return;
  try{const{error}=await sb.from('coach_data').upsert({user_id:auth.user.id,email:auth.user.email||null,data:S,updated_at:new Date().toISOString()});
    auth.sync=error?'Could not save to your account. It will retry on your next change.':'Saved to your account'}
  catch(e){auth.sync='Offline. Changes are kept on this device and sent later.'}
  showSync();
}
async function pull(){

const nice=m=>/invalid login/i.test(m)?'Wrong email or password.':/not confirmed/i.test(m)?'Confirm your email first. Check your inbox for the link.':/already registered/i.test(m)?'That email already has an account. Log in instead.':/fetch|network/i.test(m)?"Can't reach the server. Check your connection and try again.":m;
async function authGo(){
  if(auth.busy)return;
  const m=auth.mode,email=auth.email.trim(),pw=auth.pw,back=location.origin+location.pathname;
  const fail=t=>{auth.msg=t;auth.err=true;auth.busy=false;render()};
  if(m!=='new'&&!/^\S+@\S+\.\S+$/.test(email))return fail('Enter your email address.');
  if(m==='in'&&!pw)return fail('Enter your password.');
  if((m==='up'||m==='new')&&pw.length<8)return fail('Use at least 8 characters for the password.');
  auth.busy=true;auth.msg='';render();
  try{
    let r;
    if(m==='in')r=await sb.auth.signInWithPassword({email,password:pw});
    else if(m==='up')r=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:back}});
    else if(m==='reset')r=await sb.auth.resetPasswordForEmail(email,{redirectTo:back});
    else r=await sb.auth.updateUser({password:pw});
    if(r.error)return fail(nice(r.error.message||''));
    auth.busy=false;auth.err=false;auth.pw='';
    if(m==='up'&&!(r.data&&r.data.session)){auth.mode='in';auth.msg='Check your email for a confirmation link, then log in.'}
    if(m==='reset'){auth.mode='in';auth.msg='If that email has an account, a reset link is on its way.'}
    if(m==='new')auth.mode='in';
    render();
  }catch(e){fail("Can't reach the server. Check your connection and try again.")}
}

const day=k=>S.days[k]||(S.days[k]={});
const kind=d=>[0,1,2,1,2,1,2][d.getDay()]; // 0 rest, 1 circuit, 2 walk
function week(){return Math.max(1,Math.floor((today()-parse(S.start))/864e5/7)+1)}
function phase(){
  const w=week();
  if(w<=2)return{id:1,label:'Weeks 1 and 2: learn the moves',rounds:3,ex:BASE};

function streak(){
  let n=0,d=today();const st=parse(S.start);
  for(let i=0;i<500&&d>=st;i++,d=addDays(d,-1)){
    const x=S.days[dkey(d)];
    if(x&&(x.workout||x.walk))n++;else if(d.getDay()!==0&&i>0)break;
  }
  return n;
}
function weekCounts(mon){let w=0,k=0;for(let i=0;i<7;i++){const d=S.days[dkey(addDays(mon,i))];if(d){if(d.workout)w++;if(d.walk)k++}}return{w,k}}

function chart(ws){

  const pts=ws.map(w=>[P+(W-2*P)*((parse(w.d)-t0)/((t1-t0)||1)),P+(H-2*P)*(1-(w.kg-lo)/(hi-lo))].map(n=>n.toFixed(1)));
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time"><polyline fill="none" stroke="#3DDC84" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>
  ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#131915" stroke="#3DDC84" stroke-width="2.5"/>`).join('')}
  <text x="0" y="10" fill="#8E9F95" font-size="10">${hi.toFixed(1)}</text><text x="0" y="${H-1}" fill="#8E9F95" font-size="10">${lo.toFixed(1)}</text></svg>`;
}

    <button class="sec" style="margin-top:8px" data-act="import">Restore from backup</button>
    <input id="file" type="file" accept="application/json" hidden>
    <button class="sec" style="margin-top:8px;color:var(--warn)" data-act="reset">${resetArmed?'Tap again to erase everything':'Erase all data'}</button>
    <p class="sub" style="margin-top:14px">Your log is saved in this browser only. Download a backup now and then, and use it to move to another phone or laptop.</p></div>
  <p class="sub" style="text-align:center;font-size:13px;margin-top:18px">Exercise photos from the public-domain free-exercise-db project.</p>`;
}

/* ---------- guided workout ---------- */
function startSess(){
  const p=phase(),steps=WARM.map(x=>({...x}));
  for(let r=1;r<=p.rounds;r++){
    p.ex.forEach((x,i)=>steps.push({...x,round:r,idx:i}));
    if(r<p.rounds)steps.push({rest:1,s:75,round:r});
  }
  sess={steps,i:0,rounds:p.rounds,per:p.ex.length,end:null,left:0,fin:false,t0:Date.now(),half:false};
  quitArmed=false;enter();wake();
}
function enter(){
  const s=sess.steps[sess.i];
  sess.left=s.s||0;sess.half=false;quitArmed=false;
  sess.end=s.rest?Date.now()+s.s*1000:null;
  if(s.rest)say(`Rest. Round ${s.round+1} is next.`);
  else say(label(s)+'. '+(s.s?s.s+' seconds.':s.r+(s.leg?' each leg.':'.')));
  render();window.scrollTo(0,0);
}
function nextStep(){
  if(sess.i>=sess.steps.length-1){
    sess.fin=true;sess.end=null;sess.min=Math.max(1,Math.round((Date.now()-sess.t0)/6e4));
    day(dkey(today())).workout={rounds:sess.rounds,phase:phase().id,min:sess.min};
    S.best=Math.max(S.best||0,streak());save();beep(3);say('Workout done. Well done.');render();window.scrollTo(0,0);return;
  }
  sess.i++;enter();
}
function vSess(){
  if(sess.fin)return `<div class="fin"><div class="name">Workout done</div><p class="tip">Drink some water and get protein in within the next couple of hours.</p>
    <div class="stats"><div class="stat"><b>${sess.rounds}</b><span>rounds</span></div><div class="stat"><b>${sess.min}</b><span>minutes</span></div><div class="stat"><b>${streak()}</b><span>day streak</span></div></div>
    <label for="push">Most push-ups you did in one round (optional)</label>
    <input id="push" type="number" inputmode="numeric" placeholder="For example 10">
    <br><br><button class="pri" data-act="finish">Save and finish</button></div>`;
  const s=sess.steps[sess.i],nx=sess.steps[sess.i+1],timed=!!s.s,running=!!sess.end;
  const head=s.warm?'Warm-up':s.rest?`Round ${s.round} done`:`Round ${s.round} of ${sess.rounds}`;
  let segs='';
  if(s.warm)segs=WARM.map((_,i)=>`<i class="${i<sess.i?'d':i===sess.i?'c':''}"></i>`).join('');
  else for(let i=0;i<sess.per;i++)segs+=`<i class="${s.rest||i<s.idx?'d':i===s.idx?'c':''}"></i>`;
  const show=s.rest?nx:s;
  return `<div class="top"><button data-act="quit">${I('x',16)}${quitArmed?'Tap again to quit':'Quit'}</button><span>${head}</span><button data-act="voice" aria-label="Sound ${S.voice?'on':'off'}">${I(S.voice?'sound':'mute',18)}${S.voice?'On':'Off'}</button></div>
  <div class="segs">${segs}</div>
  ${demo(show.e,'go',`<button class="how" data-act="info" data-id="${show.e}">How to do it</button>`)}
  <div class="body"><div class="name">${s.rest?'Rest':label(s)}</div>
    <div class="num${!timed&&String(s.r).length>2?' sm':''}" id="clock">${timed?fmt(sess.left):'×'+s.r}</div>
    ${timed?'':`<div class="unit">${s.leg?'each leg':'reps'}</div>`}
    <p class="tip">${s.rest?`Breathe and sip some water. ${label(nx)} is first in round ${s.round+1}.`:s.t||TIPS[s.e]||''}</p></div>
  <div class="foot">
    ${nx&&!s.rest?`<div class="nx">${nx.rest?'':`<img src="${(PIC[nx.e]||[])[1]||''}" alt="">`}Next: ${nx.rest?'rest':label(nx)}</div>`:(!nx?'<div class="nx">Last one. Finish strong.</div>':'')}
    ${timed?`<button class="pri" data-act="toggle">${running?'Pause':sess.left<s.s?'Resume':'Start timer'}</button>`:`<button class="pri" data-act="next">Done</button>`}
    <div class="row"><button data-act="back">Back</button><button data-act="next">${timed?(s.rest?'Skip rest':'Skip'):'Skip'}</button></div></div>`;
}
setInterval(()=>{
  if(sess&&sess.end){
    const s=sess.steps[sess.i],rem=Math.max(0,Math.ceil((sess.end-Date.now())/1000));
    if(rem!==sess.left){
      sess.left=rem;const c=$('#clock');if(c)c.textContent=fmt(rem);
      if(rem>0&&rem<=3)beep(1,true);
      if(!s.rest&&!sess.half&&s.s>=30&&rem===Math.floor(s.s/2)){sess.half=true;say('Halfway.')}
      if(s.rest&&rem===10)say('Ten seconds.');
    }
    if(rem<=0){beep(2);nextStep()}
  }
  if(!sess&&S.walkStart){const w=$('#watch');if(w)w.textContent=fmt(Math.floor((Date.now()-S.walkStart)/1000))}
},200);

let ac=null,lock=null;
function beep(n,soft){
  if(!S.voice&&n)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    for(let i=0;i<n;i++){
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.22;
      o.frequency.value=soft?660:880;g.gain.setValueAtTime(soft?.08:.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.2);
    }
    if(!soft&&n&&navigator.vibrate)navigator.vibrate(200);
  }catch(e){}
}
function say(t){
  if(!S.voice)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.02;speechSynthesis.speak(u)}catch(e){}
}
async function wake(){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}
function unwake(){try{lock&&lock.release()}catch(e){}lock=null}
function pause(){if(sess&&sess.end&&!sess.steps[sess.i].rest){sess.left=Math.max(0,Math.ceil((sess.end-Date.now())/1000));sess.end=null}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button');
  if(nb){tab=nb.dataset.tab;resetArmed=false;render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,k=dkey(today());
  if(a==='closesheet'){if(e.target!==el&&!el.dataset.force)return;sheet=null;render();return}
  if(a==='authmode'){auth.mode=el.dataset.m;auth.msg='';render();return}
  if(a==='authgo'){authGo();return}
  if(a==='guest'){S.guest=true;save();render();return}
  if(a==='login'){S.guest=false;save();auth.mode='in';auth.msg='';render();window.scrollTo(0,0);return}
  if(a==='signout'){signOut();return}
  if(a==='people'){loadPeople();return}
  if(a!=='reset')resetArmed=false;
  if(a!=='quit')quitArmed=false;
  if(a==='info'){pause();sheet=el.dataset.id}
  if(a==='start'){beep(0);startSess();return}
  if(a==='force')forceCircuit=true;
  if(a==='walkgo'){S.walkStart=Date.now();save()}
  if(a==='walkstop'){const m=Math.max(1,Math.round((Date.now()-S.walkStart)/6e4));delete S.walkStart;const d=day(k);d.walk={min:(d.walk?d.walk.min:0)+m};S.best=Math.max(S.best||0,streak());save()}
  if(a==='walk'){const m=parseInt($('#walkMin').value,10);if(m>0){day(k).walk={min:m};S.best=Math.max(S.best||0,streak());save()}}
  if(a==='habit'){const d=day(k);d.habits=d.habits||{};d.habits[el.dataset.id]=!d.habits[el.dataset.id];save()}
  if(a==='weight'){const v=parseFloat($('#kg').value);if(v>20&&v<300){S.weights=S.weights.filter(w=>w.d!==k);S.weights.push({d:k,kg:Math.round(v*10)/10});save()}}
  if(a==='voice'){S.voice=!S.voice;save();if(!S.voice)try{speechSynthesis.cancel()}catch(err){}}
  if(a==='toggle'){
    if(sess.end){sess.left=Math.max(0,Math.ceil((sess.end-Date.now())/1000));sess.end=null}
    else{beep(0);sess.end=Date.now()+sess.left*1000}
  }
  if(a==='next'){nextStep();return}
  if(a==='back'&&sess.i>0){sess.i--;enter();return}
  if(a==='quit'){if(quitArmed){sess=null;unwake();try{speechSynthesis.cancel()}catch(err){}}else quitArmed=true}
  if(a==='finish'){const v=parseInt($('#push').value,10);if(v>0&&v<500){day(k).workout.push=v;save()}sess=null;forceCircuit=false;unwake();tab='progress'}
  if(a==='export'){
    const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
    const l=document.createElement('a');l.href=u;l.download='home-coach-backup-'+k+'.json';document.body.appendChild(l);l.click();l.remove();return;
  }
  if(a==='import'){$('#file').click();return}
  if(a==='reset'){if(resetArmed){const g=S.guest;S=fresh();S.guest=g;save();resetArmed=false}else resetArmed=true}
  render();
});
document.addEventListener('change',e=>{
  if(e.target.id==='start'&&e.target.value){S.start=e.target.value;save();render()}
  if(e.target.id==='file'&&e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const s=JSON.parse(r.result);if(s&&s.days&&s.start){S=s;S.weights=S.weights||[];save();tab='progress';render()}}catch(err){}};
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener('input',e=>{if(e.target.id==='em')auth.email=e.target.value;if(e.target.id==='pw')auth.pw=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='em'||e.target.id==='pw')){e.preventDefault();authGo()}if(e.key==='Escape'&&sheet){sheet=null;render()}});
document.addEventListener('visibilitychange',()=>{if(sess&&!sess.fin&&document.visibilityState==='visible')wake()});
if(auth.on){
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY')auth.mode='new';
    setTimeout(()=>onUser(session?session.user:null),0);
  });
  sb.auth.getSession().then(({data})=>onUser(data&&data.session?data.session.user:null)).catch(()=>{auth.ready=true;render()});
}
render();
</script>
</body>
</html>
